      progBox.classList.add('active');
      btnPNG.disabled = true;
      btnPDF.disabled = true;
      btnClose.textContent = '中止する';

      const setProgress = (msg, pct) => {
        progText.textContent = msg;
        progBar.style.width = `${pct}%`;
      };

      try {
        // 1. 出発地から東西南北 各1,000m (2km×2km) のZ17 (512px/tile) ピクセル座標範囲を算出
        const centerLon = startPoint[0];
        const centerLat = startPoint[1];
        const metersPerPxZ17 = (40075016.686 * Math.cos(centerLat * Math.PI / 180)) / (EXPORT_TILE_PX * Math.pow(2, EXPORT_ZOOM));
        const halfSpanZ17Px = EXPORT_HALF_DIST_M / metersPerPxZ17; // 約2,063 px (片側1km)
        const fullSpanZ17Px = halfSpanZ17Px * 2;                   // 約4,126 px (全体2km・Z17等倍)

        const centerWorldX = lonToWorldPxZ17(centerLon);
        const centerWorldY = latToWorldPxZ17(centerLat);
        const minWorldX = centerWorldX - halfSpanZ17Px;
        const maxWorldX = centerWorldX + halfSpanZ17Px;
        const minWorldY = centerWorldY - halfSpanZ17Px;
        const maxWorldY = centerWorldY + halfSpanZ17Px;

        const { canvas, ctx, side: canvasSide } = createExportCanvas(fullSpanZ17Px, format);
        const scale = canvasSide / fullSpanZ17Px; // Z17ネイティブピクセル -> 出力Canvasピクセル係数 (1.0〜2.0x)

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        // 背景を白で初期化
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasSide, canvasSide);

        const toCanvasX = (lon) => (lonToWorldPxZ17(lon) - minWorldX) * scale;
        const toCanvasY = (lat) => (latToWorldPxZ17(lat) - minWorldY) * scale;

        const minTx = Math.floor(minWorldX / EXPORT_TILE_PX);
        const maxTx = Math.floor(maxWorldX / EXPORT_TILE_PX);
        const minTy = Math.floor(minWorldY / EXPORT_TILE_PX);
        const maxTy = Math.floor(maxWorldY / EXPORT_TILE_PX);

        // 2. Z17範囲外の周辺部も欠けないよう、まずZ13ベースタイルを下敷き描画 (2^(17-13) = 16倍)
        setProgress('広域背景タイルを準備中...', 5);
        const zDiffFactor = Math.pow(2, EXPORT_ZOOM - 13); // 16
        const minTx13 = Math.floor(minTx / zDiffFactor);
        const maxTx13 = Math.floor(maxTx / zDiffFactor);
        const minTy13 = Math.floor(minTy / zDiffFactor);
        const maxTy13 = Math.floor(maxTy / zDiffFactor);
        for (let tx13 = minTx13; tx13 <= maxTx13; tx13++) {
          for (let ty13 = minTy13; ty13 <= maxTy13; ty13++) {
            if (tx13 >= Z13_BOUNDS.minX && tx13 <= Z13_BOUNDS.maxX &&
                ty13 >= Z13_BOUNDS.minY && ty13 <= Z13_BOUNDS.maxY) {
              const img13 = await loadTileImage(`./tiles/13/${tx13}/${ty13}.png`);
              if (img13) {
                const tileWorldX = tx13 * zDiffFactor * EXPORT_TILE_PX;
                const tileWorldY = ty13 * zDiffFactor * EXPORT_TILE_PX;
                const tileSpan = zDiffFactor * EXPORT_TILE_PX * scale;
                const dx = (tileWorldX - minWorldX) * scale;
                const dy = (tileWorldY - minWorldY) * scale;
                ctx.drawImage(img13, dx, dy, tileSpan, tileSpan);
              }
            }
          }
        }

        // 3. Z17タイル一覧を作成し並列バッチで高速描画
        const z17Tasks = [];
        for (let ty = minTy; ty <= maxTy; ty++) {
          for (let tx = minTx; tx <= maxTx; tx++) {
            if (tx >= Z17_BOUNDS.minX && tx <= Z17_BOUNDS.maxX &&
                ty >= Z17_BOUNDS.minY && ty <= Z17_BOUNDS.maxY) {
              z17Tasks.push({ tx, ty });
            }
          }
        }

        const totalTiles = z17Tasks.length;
        const BATCH_SIZE = 32;
        let loadedCount = 0;

        for (let i = 0; i < totalTiles; i += BATCH_SIZE) {
          if (cancelExportRequested) return;
          const batch = z17Tasks.slice(i, i + BATCH_SIZE);
          const imgs = await Promise.all(
            batch.map(t => loadTileImage(`./tiles/17/${t.tx}/${t.ty}.png`))
          );

          for (let j = 0; j < batch.length; j++) {
            const img = imgs[j];
            if (!img) continue;
            const { tx, ty } = batch[j];
            const dx = (tx * EXPORT_TILE_PX - minWorldX) * scale;
            const dy = (ty * EXPORT_TILE_PX - minWorldY) * scale;
            const dw = EXPORT_TILE_PX * scale + 0.5; // タイル境界の隙間防止
            ctx.drawImage(img, dx, dy, dw, dw);
          }

          loadedCount += batch.length;
          const pct = Math.min(75, Math.round(10 + (loadedCount / Math.max(1, totalTiles)) * 65));
          setProgress(`Z17高精細タイルを描画中... ${loadedCount} / ${totalTiles}枚`, pct);
        }

        if (cancelExportRequested) return;

        // 4. 計算結果（道路グラデーション・メジャー目盛り・ラベル）の描画
        if (showScaleOverlay && cachedSegFeatures.length > 0) {
          setProgress('道路スケール・グラデーションを描画中...', 82);
          await new Promise(r => setTimeout(r, 20));

          // 4-1. 道路ケーシング（外枠）
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
          ctx.lineWidth = Math.max(3, 10.5 * scale);
          ctx.beginPath();
          for (let i = 0; i < cachedSegFeatures.length; i++) {
            const coords = cachedSegFeatures[i].geometry.coordinates;
            ctx.moveTo(toCanvasX(coords[0][0]), toCanvasY(coords[0][1]));
            ctx.lineTo(toCanvasX(coords[1][0]), toCanvasY(coords[1][1]));
          }
          ctx.stroke();
          ctx.restore();

          // 4-2. 道路グラデーション本体
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = Math.max(2, 7.0 * scale);
          for (let i = 0; i < cachedSegFeatures.length; i++) {
            const f = cachedSegFeatures[i];
            const coords = f.geometry.coordinates;
            ctx.strokeStyle = getColorAtRatio(f.properties.ratio);
            ctx.beginPath();
            ctx.moveTo(toCanvasX(coords[0][0]), toCanvasY(coords[0][1]));
            ctx.lineTo(toCanvasX(coords[1][0]), toCanvasY(coords[1][1]));
            ctx.stroke();
          }
          ctx.restore();

          // 4-3. メジャー目盛り線（10m/50m/100m/500mすべて高精細ベクター描画）
          ctx.save();
          ctx.lineCap = 'butt';
          for (let i = 0; i < cachedTickFeatures.length; i++) {
            const tf = cachedTickFeatures[i];
            const lvl = tf.properties.level;
            const coords = tf.geometry.coordinates;
            const x0 = toCanvasX(coords[0][0]);
            const y0 = toCanvasY(coords[0][1]);
            const x1 = toCanvasX(coords[1][0]);
            const y1 = toCanvasY(coords[1][1]);

            // 白縁取り
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.lineWidth = (lvl === 4 ? 5.2 : lvl === 3 ? 4.0 : lvl === 2 ? 3.0 : 2.0) * scale;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();

            // 目盛り本体
            ctx.strokeStyle = lvl >= 3 ? '#0f172a' : getColorAtRatio(tf.properties.ratio);
            ctx.lineWidth = (lvl === 4 ? 3.0 : lvl === 3 ? 2.2 : lvl === 2 ? 1.6 : 1.1) * scale;
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
          }
          ctx.restore();

          // 4-4. 玄関〜道路スナップ点の破線
          if (snapInfo) {
            ctx.save();
            ctx.strokeStyle = '#059669';
            ctx.lineWidth = Math.max(2, 3.5 * scale);
            ctx.setLineDash([6 * scale, 6 * scale]);
            ctx.beginPath();
            ctx.moveTo(toCanvasX(startPoint[0]), toCanvasY(startPoint[1]));
            ctx.lineTo(toCanvasX(snapInfo.lon), toCanvasY(snapInfo.lat));
            ctx.stroke();
            ctx.restore();
          }
        }

        // 5. 計測ルート強調線（存在する場合）
        if (targetRouteCoords && targetRouteCoords.length >= 2) {
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = Math.max(5, 11.5 * scale);
          ctx.beginPath();
          targetRouteCoords.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(toCanvasX(pt[0]), toCanvasY(pt[1]));
            else ctx.lineTo(toCanvasX(pt[0]), toCanvasY(pt[1]));
          });
          ctx.stroke();

          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = Math.max(3, 6.8 * scale);
          ctx.stroke();
          ctx.restore();
        }

        // 6. 避難所・給水拠点アイコン（表示ON時）
        if (showFacilities && facilitiesData.length > 0) {
          ctx.save();
          const r = Math.max(8, 12.5 * scale);
          for (const f of facilitiesData) {
            const fx = toCanvasX(f.coords[0]);
            const fy = toCanvasY(f.coords[1]);
            if (fx < -r || fx > canvasSide + r || fy < -r || fy > canvasSide + r) continue;
            let bg = '#059669';
            let emoji = '🏫';
            if (f.category === '給水拠点') { bg = '#0284c7'; emoji = '💧'; }
            else if (f.category === '広域避難場所' || f.category === 'いっとき避難場所') { bg = '#16a34a'; emoji = '🌳'; }
            else if (f.category === '福祉避難所') { bg = '#db2777'; emoji = '🏥'; }

            ctx.beginPath();
            ctx.arc(fx, fy, r, 0, Math.PI * 2);
            ctx.fillStyle = bg;
            ctx.fill();
            ctx.lineWidth = Math.max(1.5, 2.4 * scale);
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.font = `${Math.round(r * 1.1)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, fx, fy + 1);
          }
          ctx.restore();
        }

        // 7. 距離・所要時間・消費エネルギーバッジ（重なり回避付き、Z17・1km圏ではstepMod=2またはユーザー設定間隔で描画）
        if (showScaleOverlay && labelContentMode !== 'none' && cachedLabelFeatures.length > 0) {
          setProgress('距離・エネルギー・時間ラベルを配置中...', 88);
          const exportStepMod = tickIntervalSetting === 'auto' ? 2 : Math.max(1, Math.round(Number(tickIntervalSetting) / 50));
          const placedBoxes = [];
          const badgeScale = Math.max(0.85, scale * 1.1);
          const edgeMargin = 36 * badgeScale;
          const padBox = 5 * badgeScale;

          ctx.save();
          for (let i = 0; i < cachedLabelFeatures.length; i++) {
            const lf = cachedLabelFeatures[i];
            const stepIdx = lf.properties.stepIdx;
            if (!stepIdx || stepIdx % exportStepMod !== 0) continue;

            const lx = toCanvasX(lf.geometry.coordinates[0]);
            const ly = toCanvasY(lf.geometry.coordinates[1]);
            if (lx < edgeMargin || lx > canvasSide - edgeMargin || ly < edgeMargin || ly > canvasSide - edgeMargin) continue;

            const isMajor = (stepIdx % 10 === 0);
            const text = formatBadgeLabelText(stepIdx);
            if (!text) continue;

            const fontSize = Math.round((isMajor ? 14 : 12) * badgeScale);
            ctx.font = `${isMajor ? '800' : '700'} ${fontSize}px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;
            const tw = ctx.measureText(text).width;
            const bw = tw + 22 * badgeScale;
            const bh = fontSize + 10 * badgeScale;
            const box = { x0: lx - bw / 2 - padBox, y0: ly - bh / 2 - padBox, x1: lx + bw / 2 + padBox, y1: ly + bh / 2 + padBox };

            let overlaps = false;
            for (let k = 0; k < placedBoxes.length; k++) {
              const b = placedBoxes[k];
              if (box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0) {
                overlaps = true;
                break;
              }
            }
            if (overlaps) continue;
            placedBoxes.push(box);

            const accentColor = getColorAtRatio(lf.properties.ratio);
            ctx.beginPath();
            ctx.roundRect(lx - bw / 2, ly - bh / 2, bw, bh, bh / 2);
            ctx.fillStyle = isMajor ? 'rgba(15, 23, 42, 0.94)' : 'rgba(255, 255, 255, 0.94)';
            ctx.fill();
            ctx.lineWidth = Math.max(1.2, (isMajor ? 2.2 : 1.5) * badgeScale);
            ctx.strokeStyle = isMajor ? accentColor : 'rgba(15, 23, 42, 0.7)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(lx - bw / 2 + 8 * badgeScale, ly, 3.5 * badgeScale, 0, Math.PI * 2);
            ctx.fillStyle = accentColor;
            ctx.fill();

            ctx.fillStyle = isMajor ? '#ffffff' : '#0f172a';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, lx - bw / 2 + 15 * badgeScale, ly + 0.5);
          }
          ctx.restore();
        }

        // 8. スタート地点ピン描画
        {
          const sx = toCanvasX(startPoint[0]);
          const sy = toCanvasY(startPoint[1]);
          const pinScale = Math.max(1.0, scale * 1.35);
          ctx.save();
          ctx.beginPath();
          ctx.arc(sx, sy, 14 * pinScale, 0, Math.PI * 2);
          ctx.fillStyle = '#10b981';
          ctx.fill();
          ctx.lineWidth = 3.5 * pinScale;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          const startElevStr = snapInfo ? `標高${snapInfo.elev.toFixed(1)}m` : '0m';
          const labelStr = startPointName ? `🏠 ${startPointName} (${startElevStr})` : `🏠 スタート地点 (${startElevStr})`;
          const fSize = Math.round(13 * pinScale);
          ctx.font = `800 ${fSize}px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;
          const lWidth = ctx.measureText(labelStr).width + 18 * pinScale;
          const lHeight = fSize + 10 * pinScale;
          ctx.beginPath();
          ctx.roundRect(sx - lWidth / 2, sy - 16 * pinScale - lHeight, lWidth, lHeight, lHeight / 2);
          ctx.fillStyle = '#0f172a';
          ctx.fill();
          ctx.lineWidth = 2 * pinScale;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(labelStr, sx, sy - 16 * pinScale - lHeight / 2 + 0.5);
          ctx.restore();
        }

        // 9. ヘッダー情報カード・方位記号・スケール凡例オーバーレイの描画
        const uiScale = canvasSide / 4096;
        const pad = Math.round(36 * uiScale);

        // 9-1. 左上タイトル＆条件カード
        ctx.save();
        const cardW = Math.round(860 * uiScale);
        const cardH = Math.round(150 * uiScale);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.beginPath();
        ctx.roundRect(pad, pad, cardW, cardH, Math.round(18 * uiScale));
        ctx.fill();
        ctx.lineWidth = Math.round(2 * uiScale);
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = `800 ${Math.round(30 * uiScale)}px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('小平市 防災・徒歩距離＆消費エネルギースケールマップ', pad + Math.round(24 * uiScale), pad + Math.round(22 * uiScale));

        ctx.fillStyle = '#334155';
        ctx.font = `700 ${Math.round(19 * uiScale)}px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;
        const startElevText = snapInfo ? ` (標高${snapInfo.elev.toFixed(1)}m)` : '';
        const startDesc = startPointName ? `出発地: ${startPointName}${startElevText}` : `出発地: ${startPoint[1].toFixed(4)}, ${startPoint[0].toFixed(4)}${startElevText}`;
        ctx.fillText(`${startDesc} ｜ 東西南北 各1km範囲 (Z17高精細)`, pad + Math.round(24 * uiScale), pad + Math.round(68 * uiScale));
        ctx.fillStyle = '#0284c7';
        const { desc: loadDesc } = getLoadInfoForPace(walkingPace);
        const dirDesc = directionMode === 'roundtrip' ? '往復' : '片道';
        const rangeDesc = scaleMetric === 'energy'
          ? `消費エネルギー基準(${dirDesc}) 最大${getMaxEnergyKcal()}kcal`
          : `実距離基準(${dirDesc}) 最大${(maxDistance / 1000).toFixed(1)}km`;
        ctx.fillText(`${currentPaceLabel}［${loadDesc}］｜ ${rangeDesc}`, pad + Math.round(24 * uiScale), pad + Math.round(102 * uiScale));
        ctx.restore();

        // 9-2. 右上コンパス
        ctx.save();
        const compR = Math.round(52 * uiScale);
        const compX = canvasSide - pad - compR;
        const compY = pad + compR;
        ctx.beginPath();
        ctx.arc(compX, compY, compR, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fill();
        ctx.lineWidth = Math.round(3 * uiScale);
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();

        ctx.translate(compX, compY);
        const ah = compR * 0.68;
        const aw = compR * 0.24;
        ctx.beginPath();
        ctx.moveTo(0, -ah);
        ctx.lineTo(aw, 0);
        ctx.lineTo(-aw, 0);
        ctx.closePath();
        ctx.fillStyle = '#dc2626';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(0, ah);
        ctx.lineTo(aw, 0);
        ctx.lineTo(-aw, 0);
        ctx.closePath();
        ctx.fillStyle = '#94a3b8';
        ctx.fill();

        ctx.font = `900 ${Math.round(compR * 0.38)}px sans-serif`;
        ctx.fillStyle = '#dc2626';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('N', 0, -ah - 2 * uiScale);
        ctx.restore();

        // 9-3. 左下グラデーション凡例
        if (showScaleOverlay) {
          ctx.save();
          const legW = Math.round(820 * uiScale);
          const legH = Math.round(135 * uiScale);
          const legX = pad;
          const legY = canvasSide - pad - legH;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.roundRect(legX, legY, legW, legH, Math.round(18 * uiScale));
          ctx.fill();
          ctx.lineWidth = Math.round(2 * uiScale);
          ctx.strokeStyle = '#cbd5e1';
          ctx.stroke();

          const barX = legX + Math.round(34 * uiScale);
          const barY = legY + Math.round(52 * uiScale);
          const barW = legW - Math.round(68 * uiScale);
          const barH = Math.round(24 * uiScale);

          const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
          const stops = PALETTES[currentPaletteKey] || PALETTES.standard;
          for (const s of stops) {
            grad.addColorStop(s.t, `rgb(${s.rgb[0]},${s.rgb[1]},${s.rgb[2]})`);
          }
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(barX, barY, barW, barH, barH / 2);
          ctx.fill();

          const fractions = [0, 1 / 6, 2 / 6, 3 / 6, 4 / 6, 5 / 6, 1];
          const maxKcal = getMaxEnergyKcal();
          const flat1mKcal = Math.max(0.01, computeSegmentEnergyKcal(1, 0, 0));
          ctx.font = `800 ${Math.round(18 * uiScale)}px -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;
          ctx.textAlign = 'center';
          fractions.forEach(f => {
            const tx = barX + barW * f;
            if (scaleMetric === 'energy') {
              const k = Math.round(maxKcal * f);
              const eqDist = Math.round((maxKcal * f) / flat1mKcal);
              ctx.fillStyle = '#0f172a';
              ctx.textBaseline = 'bottom';
              ctx.fillText(k === 0 ? '0kcal' : `${k}kcal`, tx, barY - Math.round(6 * uiScale));
              ctx.fillStyle = '#0284c7';
              ctx.textBaseline = 'top';
              ctx.fillText(eqDist === 0 ? '0m' : `約${formatDistShort(eqDist)}`, tx, barY + barH + Math.round(6 * uiScale));
            } else {
              const d = Math.round(maxDistance * f);
              const m = directionMode === 'roundtrip'
                ? Math.round(d / 80 + d / walkingPace)
                : Math.round(d / walkingPace);
              ctx.fillStyle = '#0f172a';
              ctx.textBaseline = 'bottom';
              ctx.fillText(d === 0 ? '0m' : formatDistShort(d), tx, barY - Math.round(6 * uiScale));
              ctx.fillStyle = '#0284c7';
              ctx.textBaseline = 'top';
              ctx.fillText(`${m}分`, tx, barY + barH + Math.round(6 * uiScale));
            }
          });
          ctx.restore();
        }

        // 9-4. 右下クレジット＆250m実寸スケールバー
        ctx.save();
        const scaleBarMeters = 250;
        const scaleBarPx = (scaleBarMeters / metersPerPxZ17) * scale;
        const sbRight = canvasSide - pad;
        const sbLeft = sbRight - scaleBarPx;
        const sbY = canvasSide - pad - Math.round(36 * uiScale);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.beginPath();
        ctx.roundRect(sbLeft - Math.round(20 * uiScale), sbY - Math.round(36 * uiScale), scaleBarPx + Math.round(40 * uiScale), Math.round(72 * uiScale), Math.round(10 * uiScale));
        ctx.fill();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = Math.round(4 * uiScale);
        ctx.beginPath();
        ctx.moveTo(sbLeft, sbY - Math.round(10 * uiScale));
        ctx.lineTo(sbLeft, sbY);
        ctx.lineTo(sbRight, sbY);
        ctx.lineTo(sbRight, sbY - Math.round(10 * uiScale));
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = `800 ${Math.round(18 * uiScale)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`${scaleBarMeters} m (直線)`, (sbLeft + sbRight) / 2, sbY - Math.round(4 * uiScale));

        ctx.fillStyle = '#475569';
        ctx.font = `600 ${Math.round(14 * uiScale)}px sans-serif`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText('© OpenStreetMap contributors (ODbL) | MapLibre', sbRight, sbY + Math.round(8 * uiScale));
        ctx.restore();

        if (cancelExportRequested) return;

        // 10. ファイル生成＆ダウンロード実行
        if (format === 'png') {
          setProgress('高精細PNG画像を生成・保存しています...', 95);
          await new Promise((resolve, reject) => {
            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error('PNG生成に失敗しました'));
                return;
              }
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `小平市徒歩スケールマップ_Z17_東西南北1km.png`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 10000);
              resolve();
            }, 'image/png');
          });
        } else {
          const effectiveDpi = Math.round(canvasSide / (204 / 25.4));
          setProgress(`高解像度PDF (${effectiveDpi} dpi) を生成・保存しています...`, 95);
          await new Promise(r => setTimeout(r, 30));
          // 最高画質JPEG (0.98) + A4幅正方形シート (210mm×210mm) で約510〜1020dpiの高精細出力を実現
          const highResDataUrl = canvas.toDataURL('image/jpeg', 0.98);
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: [210, 210],
            compress: true
          });
          pdf.addImage(highResDataUrl, 'JPEG', 3, 3, 204, 204, undefined, 'FAST');
          pdf.save(`小平市徒歩スケールマップ_Z17_東西南北1km.pdf`);
        }

        setProgress('✅ ダウンロードを開始しました！', 100);
      } catch (err) {
        console.error('Export error:', err);
        setProgress(`⚠️ エラーが発生しました: ${err.message}`, 100);
      } finally {
        isExporting = false;
        btnPNG.disabled = false;
        btnPDF.disabled = false;
        btnClose.textContent = '閉じる';
      }
    }

    // =========================================================================
    // 10. マップレイヤーのセットアップ ＆ データ読み込み
    // =========================================================================
    function createFacilityIcons() {
      const types = [
        { id: 'fac-water', bg: '#0284c7', text: '💧' },
        { id: 'fac-shelter', bg: '#059669', text: '🏫' },
        { id: 'fac-park', bg: '#16a34a', text: '🌳' },
        { id: 'fac-welfare', bg: '#db2777', text: '🏥' }
      ];
      const dpr = 2;
      for (const t of types) {
        const size = 26 * dpr;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.beginPath();
        ctx.arc(13, 13, 11, 0, Math.PI * 2);
        ctx.fillStyle = t.bg;
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.text, 13, 13.5);
        map.addImage(t.id, ctx.getImageData(0, 0, size, size), { pixelRatio: dpr });
      }
    }

    map.on('zoom', () => {
      document.getElementById('zoomStatusText').textContent = `Z: ${map.getZoom().toFixed(1)}`;
      applyTickZoomFilter();
      if (tickIntervalSetting === 'auto') {
        applyScaleVisibilityAndFilters();
      }
    });

    map.on('load', async () => {
      try {
        updateLegendUI();
        updateBadgeImages();
        createFacilityIcons();

        let roadsData = window.ROADS_DATA;
        if (!roadsData) {
          const [roadsRes, facRes] = await Promise.all([
            fetch('./data/roads.json'),
            fetch('./data/facilities.json')
          ]);
          roadsData = await roadsRes.json();
          facilitiesData = await facRes.json();
        } else {
          facilitiesData = window.FACILITIES_DATA || [];
        }

        buildRoadGraph(roadsData);

        const selectEl = document.getElementById('facilitySelect');
        const groups = {
          '給水拠点': [],
          '指定避難所': [],
          '広域避難場所': [],
          'いっとき避難場所': [],
          '福祉避難所・その他': []
        };
        facilitiesData.forEach((f, idx) => {
          if (f.category === '給水拠点') groups['給水拠点'].push({ f, idx });
          else if (f.category === '指定避難所') groups['指定避難所'].push({ f, idx });
          else if (f.category === '広域避難場所') groups['広域避難場所'].push({ f, idx });
          else if (f.category === 'いっとき避難場所') groups['いっとき避難場所'].push({ f, idx });
          else groups['福祉避難所・その他'].push({ f, idx });
        });

        for (const [gName, items] of Object.entries(groups)) {
          if (items.length === 0) continue;
          const optGroup = document.createElement('optgroup');
          optGroup.label = `■ ${gName} (${items.length})`;
          for (const { f, idx } of items) {
            const opt = document.createElement('option');
            opt.value = String(idx);
            opt.textContent = `${f.name}`;
            optGroup.appendChild(opt);
          }
          selectEl.appendChild(optGroup);
        }

        map.addSource('road-scale-segments', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });
        map.addSource('road-scale-ticks', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });
        map.addSource('road-scale-labels', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });
        map.addSource('start-connector', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });
        map.addSource('target-route', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: [] }
        });

        const facFeatures = facilitiesData.map((f, idx) => {
          let iconId = 'fac-shelter';
          if (f.category === '給水拠点') iconId = 'fac-water';
          else if (f.category === '広域避難場所' || f.category === 'いっとき避難場所') iconId = 'fac-park';
          else if (f.category === '福祉避難所') iconId = 'fac-welfare';
          return {
            type: 'Feature',
            properties: { idx, name: f.name, category: f.category, iconId },
            geometry: { type: 'Point', coordinates: f.coords }
          };
        });
        map.addSource('facilities-source', {
          type: 'geojson',
          data: { type: 'FeatureCollection', features: facFeatures }
        });

        const colorExpr = getMapLibreColorExpression(currentPaletteKey);

        // 1. 道路グラデーション外枠
        map.addLayer({
          id: 'road-scale-casing-layer',
          type: 'line',
          source: 'road-scale-segments',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: {
            'line-color': 'rgba(15, 23, 42, 0.55)',
            'line-width': [
              'interpolate', ['linear'], ['zoom'],
              13, 3.5,
              15, 6.0,
              17, 9.5,
              19, 15.0
            ]
          }
        });

        // 2. 道路グラデーション本体
        map.addLayer({
          id: 'road-scale-line-layer',
          type: 'line',
          source: 'road-scale-segments',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: {
            'line-color': colorExpr,
            'line-width': [
              'interpolate', ['linear'], ['zoom'],
              13, 2.2,
              15, 4.0,
              17, 6.8,
              19, 11.0
            ],
            'line-opacity': 0.92
          }
        });

        // 3. メジャー目盛り白縁取り
        map.addLayer({
          id: 'road-scale-ticks-casing-layer',
          type: 'line',
          source: 'road-scale-ticks',
          filter: ['>=', ['get', 'level'], getMinTickLevelForZoom(map.getZoom())],
          layout: { 'line-cap': 'butt' },
          paint: {
            'line-color': 'rgba(255, 255, 255, 0.92)',
            'line-width': [
              'match', ['get', 'level'],
              4, 5.0,
              3, 4.0,
              2, 3.2,
              2.4
            ]
          }
        });

        // 4. メジャー目盛り本体
        map.addLayer({
          id: 'road-scale-ticks-layer',
          type: 'line',
          source: 'road-scale-ticks',
          filter: ['>=', ['get', 'level'], getMinTickLevelForZoom(map.getZoom())],
          layout: { 'line-cap': 'butt' },
          paint: {
            'line-color': [
              'case',
              ['>=', ['get', 'level'], 3], '#0f172a',
              colorExpr
            ],
            'line-width': [
              'match', ['get', 'level'],
              4, 3.0,
              3, 2.2,
              2, 1.8,
              1.2
            ]
          }
        });

        // 5. 玄関〜道路スナップ点の破線コネクタ
        map.addLayer({
          id: 'start-connector-layer',
          type: 'line',
          source: 'start-connector',
          paint: {
            'line-color': '#059669',
            'line-width': 3,
            'line-dasharray': [2, 2]
          }
        });

        // 6. ターゲット計測ルート強調レイヤー
        map.addLayer({
          id: 'target-route-casing',
          type: 'line',
          source: 'target-route',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: {
            'line-color': '#0f172a',
            'line-width': 10,
            'line-opacity': 0.85
          }
        });
        map.addLayer({
          id: 'target-route-line',
          type: 'line',
          source: 'target-route',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: {
            'line-color': '#fde047',
            'line-width': 5.5
          }
        });

        // 7. 避難所・給水拠点マーカーレイヤー
        map.addLayer({
          id: 'facilities-circle-layer',
          type: 'symbol',
          source: 'facilities-source',
          layout: {
            'icon-image': ['get', 'iconId'],
            'icon-size': [
              'interpolate', ['linear'], ['zoom'],
              13, 0.7,
              16, 0.95,
              18, 1.1
            ],
            'icon-allow-overlap': true
          }
        });

        // 8. 道路上のメジャー距離＆所要時間バッジレイヤー
        map.addLayer({
          id: 'road-scale-labels-layer',
          type: 'symbol',
          source: 'road-scale-labels',
          layout: {
            'icon-image': ['get', 'badgeId'],
            'symbol-sort-key': ['get', 'priority'],
            'icon-allow-overlap': false,
            'icon-padding': [
              'interpolate', ['linear'], ['zoom'],
              13, 10,
              16, 6,
              18, 3
            ]
          }
        });

        document.getElementById('zoomStatusText').textContent = `Z: ${map.getZoom().toFixed(1)}`;
        setStartLocation(startPoint, false, startPointName);
        document.getElementById('loadingToast').style.display = 'none';

      } catch (err) {
        console.error('Initialization error:', err);
        document.getElementById('loadingToast').innerHTML = '⚠️ データの読み込みに失敗しました。';
      }
    });

    // =========================================================================
    // 11. マップクリック・タップ・ホバー操作
    // =========================================================================
    let clickTimer = null;

    map.on('click', (e) => {
      if (clickTimer) clearTimeout(clickTimer);
      const clickPoint = e.point;
      const clickLngLat = e.lngLat;

      clickTimer = setTimeout(() => {
        const drawer = document.getElementById('settingsDrawer');
        if (drawer.classList.contains('open')) {
          toggleSettingsDrawer(false);
        }

        let clickedFacility = null;
        if (showFacilities && map.getLayer('facilities-circle-layer')) {
          const facHits = map.queryRenderedFeatures(clickPoint, {
            layers: ['facilities-circle-layer']
          });
          if (facHits && facHits.length > 0) {
            const p = facHits[0].properties;
            const g = facHits[0].geometry.coordinates;
            clickedFacility = {
              name: `${p.name}`,
              coords: [g[0], g[1]]
            };
          }
        }

        const coords = clickedFacility ? clickedFacility.coords : [clickLngLat.lng, clickLngLat.lat];
        const facName = clickedFacility ? clickedFacility.name : null;

        if (tapMode === 'measure') {
          setTargetMeasurePoint(coords, facName);
        } else {
          // 地図のみモード中にタップで出発地を動かした場合は自動的にスケール表示をONにする
          if (!showScaleOverlay) {
            setScaleOverlay(true);
          }
          setStartLocation(coords, false, facName);
        }
      }, 180);
    });

    map.on('dblclick', () => {
      if (clickTimer) {
        clearTimeout(clickTimer);
        clickTimer = null;
      }
    });

    map.on('mousemove', (e) => {
      const tooltip = document.getElementById('hoverTooltip');
      if (!nodeDist || window.matchMedia('(pointer: coarse)').matches) {
        tooltip.style.display = 'none';
        return;
      }

      if (showFacilities && map.getLayer('facilities-circle-layer')) {
        const facHits = map.queryRenderedFeatures(e.point, {
          layers: ['facilities-circle-layer']
        });
        if (facHits && facHits.length > 0) {
          const p = facHits[0].properties;
          const g = facHits[0].geometry.coordinates;
          const snap = findNearestEdge(g[0], g[1]);
          let distInfo = '';
          if (snap) {
            const evalRes = evaluatePointOnRoad(snap);
            if (evalRes) {
              const d = Math.round(evalRes.dist);
              const timeStr = formatMinutesForOneWayDist(evalRes.dist);
              const kcal = Math.round(evalRes.kcal);
              const elevStr = formatElevDiff(evalRes.netElevDiff);
              distInfo = ` — 道のり 約${d.toLocaleString()}m（${timeStr}）｜🔥 約${kcal}kcal｜⛰️ 標高差 ${elevStr}`;
            }
          }
          tooltip.style.display = 'block';
          tooltip.style.left = `${e.point.x}px`;
          tooltip.style.top = `${e.point.y}px`;
          tooltip.textContent = `🏫 ${p.name}（${p.category}）${distInfo}`;
          map.getCanvas().style.cursor = 'pointer';
          return;
        }
      }

      if (showScaleOverlay && map.getLayer('road-scale-line-layer')) {
        const features = map.queryRenderedFeatures(e.point, {
          layers: ['road-scale-line-layer', 'road-scale-casing-layer']
        });
        if (features && features.length > 0) {
          const props = features[0].properties;
          const dist = props.dist;
          if (dist !== undefined) {
            const timeStr = formatMinutesForOneWayDist(dist);
            const kcal = props.kcal !== undefined ? Math.round(props.kcal) : Math.round(computeSegmentEnergyKcal(dist, 0, 0));
            const dElev = props.dElev !== undefined ? formatElevDiff(props.dElev) : '±0m';
            const elev = props.elev !== undefined ? `${Number(props.elev).toFixed(1)}m` : '';
            tooltip.style.display = 'block';
            tooltip.style.left = `${e.point.x}px`;
            tooltip.style.top = `${e.point.y}px`;
            tooltip.textContent = `📏 道のり 約${dist.toLocaleString()}m（${timeStr}）｜🔥 約${kcal} kcal｜⛰️ 標高 ${elev}（${dElev}）`;
            map.getCanvas().style.cursor = 'pointer';
            return;
          }
        }
      }
      tooltip.style.display = 'none';
      map.getCanvas().style.cursor = '';
    });

    map.on('mouseout', () => {
      document.getElementById('hoverTooltip').style.display = 'none';
    });
  </script>
</body>
</html>
